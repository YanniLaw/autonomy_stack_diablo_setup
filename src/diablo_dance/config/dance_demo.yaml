# Example choreography (step-based). Conservative and mostly "in-place".
rate_hz: 50

steps:
  # 0) enter stand + height control
  - name: enter_stand
    duration: 2.0
    mode_mark: true
    mode:
      stand_mode: true
      height_ctrl_mode: true
      roll_ctrl_mode: true
      pitch_ctrl_mode: true
    value:
      up: 0.75

  # 1) warm up sway (roll) + head nod (pitch)
  - name: sway_1
    duration: 10.0
    mode_mark: false
    value:
      up: 0.75
    pattern:
      type: sine
      channels:
        roll:  {amp: 0.22, freq: 0.45, offset: 0.0, phase: 0.0}
        pitch: {amp: 0.10, freq: 0.90, offset: 0.0, phase: 1.57}

  # 2) squat pulses (height)
  - name: squat_pulse
    duration: 8.0
    mode_mark: false
    value:
      roll: 0.0
      pitch: 0.0
    pattern:
      type: sine
      channels:
        up: {amp: 0.10, freq: 0.8, offset: 0.72, phase: 0.0}

  # 3) rotate-in-place (left) while keeping body stable
  - name: rotate_in_place
    duration: 6.0
    mode_mark: false
    value:
      up: 0.74
    pattern:
      type: sine
      channels:
        left: {amp: 0.35, freq: 0.25, offset: 0.0, phase: 0.0}
        roll: {amp: 0.12, freq: 0.5, offset: 0.0, phase: 0.0}

  # 4) split mode intro + leg split wiggle
  - name: split_mode_on
    duration: 1.0
    mode_mark: true
    mode:
      split_mode: true

  - name: split_wiggle
    duration: 8.0
    mode_mark: false
    value:
      up: 0.72
      roll: 0.0
      pitch: 0.0
    pattern:
      type: sine
      channels:
        leg_split: {amp: 0.55, freq: 0.55, offset: 0.0, phase: 0.0}

  - name: split_mode_off
    duration: 0.5
    mode_mark: true
    mode:
      split_mode: false

  # 5) forward/back "groove" (very small)
  - name: groove_fb
    duration: 10.0
    mode_mark: false
    value:
      up: 0.74
    pattern:
      type: sine
      channels:
        forward: {amp: 0.15, freq: 0.4, offset: 0.0, phase: 0.0}
        roll:    {amp: 0.18, freq: 0.8, offset: 0.0, phase: 0.0}

  # 6) finale: quick sway + stop
  - name: finale
    duration: 10.0
    mode_mark: false
    value:
      up: 0.74
    pattern:
      type: sine
      channels:
        roll:  {amp: 0.28, freq: 0.7, offset: 0.0, phase: 0.0}
        pitch: {amp: 0.12, freq: 1.4, offset: 0.0, phase: 0.0}
        left:  {amp: 0.18, freq: 0.35, offset: 0.0, phase: 0.0}
